<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rojo working</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; pointer-events: none; }
  .glow { position: fixed; inset: 0; border-radius: 10px;
    box-shadow: inset 0 0 0 5px #F2481D, inset 0 0 40px 12px rgba(242, 72, 29, .55);
    animation: pulse 1.4s ease-in-out infinite alternate; }
  @keyframes pulse { to { box-shadow: inset 0 0 0 8px #F2481D, inset 0 0 60px 18px rgba(242, 72, 29, .7); } }
  .ptr { position: fixed; left: -100px; top: -100px; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%;
    background: #F2481D; box-shadow: 0 0 0 3px #fff, 0 6px 18px rgba(0,0,0,.35);
    transition: left .45s cubic-bezier(.2,.9,.3,1), top .45s cubic-bezier(.2,.9,.3,1); }
  .ring { position: fixed; width: 22px; height: 22px; margin: -14px 0 0 -14px; border-radius: 50%; border: 3px solid #F2481D; opacity: 0; }
  .ring.go { animation: ring .45s ease-out; }
  @keyframes ring { from { transform: scale(1); opacity: 1; } to { transform: scale(2.8); opacity: 0; } }
</style>
</head>
<body>
<div class="glow"></div>
<div class="ptr" id="ptr"></div>
<div class="ring" id="ring"></div>
<script>
  const ptr = document.getElementById("ptr"), ring = document.getElementById("ring");
  window.RojoDesktop.on("pointer", (p) => { ptr.style.left = p.x + "px"; ptr.style.top = p.y + "px"; ring.style.left = p.x + "px"; ring.style.top = p.y + "px"; });
  window.RojoDesktop.on("ripple", () => { ring.classList.remove("go"); void ring.offsetWidth; ring.classList.add("go"); });
</script>
</body>
</html>
