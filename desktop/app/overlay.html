<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rojo working</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; pointer-events: none; font: 600 13px/1.3 "Segoe UI", -apple-system, system-ui, sans-serif; }
  .glow { position: fixed; inset: 0; border-radius: 10px;
    box-shadow: inset 0 0 0 5px #F2481D, inset 0 0 40px 12px rgba(242, 72, 29, .55);
    animation: pulse 1.4s ease-in-out infinite alternate; }
  @keyframes pulse { to { box-shadow: inset 0 0 0 8px #F2481D, inset 0 0 60px 18px rgba(242, 72, 29, .7); } }

  /* Rojo's cursor: the arrow tip is the exact point he's acting on; his head hangs off its tail. */
  .rc { position: fixed; left: 0; top: 0; width: 0; height: 0; opacity: 0; will-change: transform;
    transition: transform .45s cubic-bezier(.2, .9, .3, 1), opacity .2s; }
  .rc.on { opacity: 1; }
  .rc.instant { transition: opacity .2s; }
  .rc-in { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: transform .12s ease-out;
    filter: drop-shadow(0 0 6px rgba(242, 72, 29, .75)) drop-shadow(0 3px 6px rgba(0, 0, 0, .3)); }
  .rc.press .rc-in { transform: scale(.82); }
  .arrow { position: absolute; left: -3px; top: -3px; width: 30px; height: 36px; }
  .head { position: absolute; left: 8px; top: 12px; width: 60px; height: 60px; animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-2px) rotate(-3deg); } }
  .label { position: absolute; left: 72px; top: 30px; max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 5px 11px; border-radius: 14px; background: rgba(21, 20, 16, .92); color: #F7F2EA; border: 1.5px solid #F2481D;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .3); opacity: 0; transform: translateX(-4px); transition: opacity .18s, transform .18s; }
  .label.on { opacity: 1; transform: none; }
  .label .k { color: #FF9C7E; }

  /* what he clicked: a ring where the tip landed */
  .ring { position: fixed; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%;
    border: 3px solid #F2481D; box-shadow: 0 0 12px rgba(242, 72, 29, .8); opacity: 0; }
  .ring.go { animation: ring .6s ease-out; }
  @keyframes ring { from { transform: scale(.6); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }
  .trail { position: fixed; height: 3px; transform-origin: 0 50%; border-radius: 3px; opacity: 0;
    background: linear-gradient(90deg, rgba(242, 72, 29, 0), rgba(242, 72, 29, .7)); }
  .trail.go { animation: trail .5s ease-out; }
  @keyframes trail { 0% { opacity: .9; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="glow"></div>
<div class="trail" id="trail"></div>
<div class="ring" id="ring"></div>
<div class="rc" id="rc">
  <div class="rc-in">
    <svg class="arrow" viewBox="0 0 30 36" aria-hidden="true">
      <path d="M3 3 L3 29 L10 22.6 L14.6 33 L19.4 30.8 L14.9 20.8 L24.6 20.8 Z" fill="#F2481D" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
    </svg>
    <div class="head" id="head"></div>
    <div class="label" id="label"></div>
  </div>
</div>
<script src="base/rojo-face.js"></script>
<script>
  const D = window.RojoDesktop;
  const rc = document.getElementById("rc"), label = document.getElementById("label");
  const ring = document.getElementById("ring"), trail = document.getElementById("trail");
  const face = RojoFace.create(document.getElementById("head"));
  face.setMood("focused");
  let at = null, labelTimer = 0, moodTimer = 0;

  function place(x, y, instant) {
    rc.classList.toggle("instant", !!instant);
    if (at && !instant) {
      const dx = x - at.x, dy = y - at.y, len = Math.hypot(dx, dy);
      if (len > 30) {
        // he looks where he's heading, and leaves a short streak behind
        face.lookAt(dx / len, dy / len);
        trail.style.left = at.x + "px"; trail.style.top = at.y + "px";
        trail.style.width = len + "px";
        trail.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
        trail.classList.remove("go"); void trail.offsetWidth; trail.classList.add("go");
        setTimeout(() => face.lookAt(null), 500);
      }
    }
    rc.style.transform = `translate(${x}px, ${y}px)`;
    rc.classList.add("on");
    at = { x, y };
  }
  function say(html) {
    clearTimeout(labelTimer);
    if (!html) { label.classList.remove("on"); return; }
    label.innerHTML = html;
    label.classList.add("on");
    labelTimer = setTimeout(() => label.classList.remove("on"), 6000);
  }
  function mood(m, ms) {
    clearTimeout(moodTimer);
    face.setMood(m);
    if (ms) moodTimer = setTimeout(() => face.setMood("focused"), ms);
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // main.js -> { x, y } where the tip goes (DIP inside this window), plus what he's doing there
  D.on("pointer", (p) => {
    if (p.x != null) place(p.x, p.y, p.instant);
    if (p.label != null) say(p.label ? esc(p.label) : "");
  });
  D.on("act", (a) => {
    if (a.label != null) say(a.html || esc(a.label));
    if (a.kind === "click") {
      rc.classList.add("press"); setTimeout(() => rc.classList.remove("press"), 140);
      if (at) { ring.style.left = at.x + "px"; ring.style.top = at.y + "px"; ring.classList.remove("go"); void ring.offsetWidth; ring.classList.add("go"); }
      face.hop(0.8); mood("happy", 700);
    } else if (a.kind === "type") mood("talking", 0);
    else if (a.kind === "look") mood("curious", 900);
    else if (a.kind === "wait") mood("thinking", 0);
    else if (a.kind === "done") mood("focused", 0);
  });
  D.on("ripple", () => { ring.style.left = (at ? at.x : -99) + "px"; ring.style.top = (at ? at.y : -99) + "px"; ring.classList.remove("go"); void ring.offsetWidth; ring.classList.add("go"); });
  D.on("cursor-reset", () => { at = null; rc.classList.remove("on"); say(""); face.setMood("focused"); });
</script>
</body>
</html>
