<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rojo</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 14px/1.35 "Segoe UI", -apple-system, system-ui, sans-serif; }
  .pill { position: absolute; inset: 6px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px;
    background: rgba(21, 20, 16, .95); color: #F1ECE4; border: 2px solid #F2481D; border-radius: 30px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #F2481D; flex: none; animation: blink 1s infinite alternate; }
  @keyframes blink { to { opacity: .35; } }
  .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  button { font: inherit; font-weight: 600; border-radius: 20px; padding: 7px 14px; cursor: pointer; flex: none; }
  #allow { background: #F2481D; color: #fff; border: 0; display: none; }
  #stop { background: transparent; color: #F1ECE4; border: 1px solid rgba(241,236,228,.45); }
  body.asking #allow { display: block; }
</style>
</head>
<body>
<div class="pill"><span class="dot"></span><span class="t" id="t">Rojo is working…</span>
  <button id="allow" type="button">Allow</button><button id="stop" type="button">Stop</button></div>
<script>
  const D = window.RojoDesktop, t = document.getElementById("t");
  D.on("pill", (p) => {
    t.textContent = p.text;
    document.body.classList.toggle("asking", !!p.asking);
    document.getElementById("stop").textContent = p.asking ? "Don't" : "Stop";
  });
  document.getElementById("allow").onclick = () => D.pillAction("allow");
  document.getElementById("stop").onclick = () => D.pillAction(document.body.classList.contains("asking") ? "deny" : "stop");
</script>
</body>
</html>
