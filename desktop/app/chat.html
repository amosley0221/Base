<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rojo</title>
<link rel="stylesheet" href="chat.css" />
</head>
<body>
<header class="head">
  <div class="face" id="face"></div>
  <div class="title"><b>Rojo</b><small id="where">on this computer</small></div>
  <button class="icon" id="new" title="New chat" aria-label="New chat">&#8635;</button>
  <button class="icon" id="settings" title="Settings" aria-label="Settings">&#9881;</button>
  <button class="icon" id="hide" title="Hide" aria-label="Hide">&#8211;</button>
</header>
<main class="log" id="log"></main>
<div class="chips" id="chips"></div>
<form class="input" id="form" autocomplete="off">
  <textarea id="text" rows="1" placeholder="Ask Rojo, or tell him what to do on this computer…"></textarea>
  <button class="send" id="send" type="submit" aria-label="Send">&#8593;</button>
</form>
<script src="base/store.js"></script>
<script>window.BASE_NO_AUTORELOAD = true;</script>
<script src="base/sync.js"></script>
<script src="base/focus.js"></script>
<script src="base/vendor/anthropic.js"></script>
<script src="base/rojo-face.js"></script>
<script src="base/agent-core.js"></script>
<script src="chat.js"></script>
</body>
</html>
