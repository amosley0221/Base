name: Android APK Release

# Two ways to cut a release:
#  1) Push a version tag:   git tag -a v1.0.0 -m "notes"; git push origin v1.0.0
#  2) Run manually from the Actions tab (workflow_dispatch): set the version
#     and tick "publish" to create the tag + GitHub Release server-side.
# Either way it builds a signed APK and attaches it to the Releases page.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
      publish:
        description: "Create the tag + GitHub Release (otherwise just build an artifact)"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for versionCode)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Pin the exact packages (the action's default list includes the
          # obsolete "tools" package, which no longer exists and breaks setup).
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Derive version, tag and release flag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            DO_RELEASE="true"
          else
            TAG_NAME="${{ github.event.inputs.version }}"
            [ "${{ github.event.inputs.publish }}" = "true" ] && DO_RELEASE="true" || DO_RELEASE="false"
          fi
          # Normalise: tag like v1.0.0, versionName like 1.0.0
          case "$TAG_NAME" in v*) : ;; *) TAG_NAME="v$TAG_NAME" ;; esac
          VERSION_NAME="${TAG_NAME#v}"
          # Strictly increasing integer required for in-place updates.
          VERSION_CODE="$(git rev-list --count HEAD)"
          {
            echo "TAG_NAME=$TAG_NAME"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "DO_RELEASE=$DO_RELEASE"
          } >> "$GITHUB_ENV"
          echo "Building $TAG_NAME (versionName=$VERSION_NAME versionCode=$VERSION_CODE) release=$DO_RELEASE"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64. Add the four ANDROID_* secrets (see android/README.md)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/base-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/base-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APK artifact
        run: |
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "::error::Signed APK not found at $SRC"; find android/app/build/outputs -name '*.apk' -print || true; exit 1
          fi
          OUT="BASE-${TAG_NAME}.apk"
          cp "$SRC" "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
          ls -la "$OUT"

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: BASE-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Resolve release notes
        if: env.DO_RELEASE == 'true'
        run: |
          NOTES_FILE="release-notes/${TAG_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" "$RUNNER_TEMP/notes.md"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            git tag -l --format='%(contents)' "${TAG_NAME}" > "$RUNNER_TEMP/notes.md"
          else
            printf 'BASE %s\n' "$TAG_NAME" > "$RUNNER_TEMP/notes.md"
          fi
          echo "NOTES_PATH=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: env.DO_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: BASE ${{ env.TAG_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ env.NOTES_PATH }}
          generate_release_notes: true
          files: ${{ env.APK_PATH }}
          fail_on_unmatched_files: true
