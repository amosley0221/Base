name: Android APK Release

# Cut a release by pushing a version tag, e.g.:
#   git tag -a v1.0.0 -m "First release"
#   git push origin v1.0.0
# The workflow builds a signed APK and publishes it to the GitHub
# Releases page with notes. You can also run it manually from the
# Actions tab (workflow_dispatch) to test a build.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name for a manual build (e.g. v0.0.1-test)"
        required: false
        default: "v0.0.0-manual"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for versionCode)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Pin the exact packages (the action's default list includes the
          # obsolete "tools" package, which no longer exists and breaks setup).
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Derive version name and code
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            RAW="${{ github.event.inputs.version }}"
            VERSION_NAME="${RAW#v}"
          fi
          # Strictly increasing integer required for in-place updates.
          VERSION_CODE="$(git rev-list --count HEAD)"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64. Add the four ANDROID_* secrets (see android/README.md)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/base-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/base-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APK artifact
        run: |
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "::error::Signed APK not found at $SRC"; find android/app/build/outputs -name '*.apk' -print || true; exit 1
          fi
          OUT="BASE-v${VERSION_NAME}.apk"
          cp "$SRC" "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
          ls -la "$OUT"

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: BASE-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Resolve release notes
        if: github.ref_type == 'tag'
        run: |
          # Prefer a hand-written notes file: release-notes/<tag>.md
          NOTES_FILE="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" "$RUNNER_TEMP/notes.md"
          else
            # Fall back to the annotated tag message.
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > "$RUNNER_TEMP/notes.md"
          fi
          echo "NOTES_PATH=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: BASE ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ env.NOTES_PATH }}
          generate_release_notes: true
          files: ${{ env.APK_PATH }}
          fail_on_unmatched_files: true
